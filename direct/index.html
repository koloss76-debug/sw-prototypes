    /* Бренд-слой SW: цвета макета легли на токены кита (шкала Brand Secondary). */
    .sw, .sw input, .sw button, .sw textarea {
      font-family: 'Gerbera', var(--font-sans);
    }
    .sw {
      --sw-brand:   var(--brand-secondary-800);
      --sw-brand-d: var(--brand-secondary-900);
      --sw-ink:     var(--label-primary);
      --sw-ink-2:   var(--grey-500);
      --sw-line:    var(--grey-300);
      --sw-line-2:  var(--grey-250);
      --sw-line-3:  var(--grey-200);
      --sw-bg:      var(--grey-100);
      --sw-card:    var(--white);
      --sw-tint:    var(--brand-secondary-tint-16);
      --sw-error:   var(--semantic-error);
      --sw-scrim:   var(--dimmer-secondary);
      --sw-safe:    var(--tg-safe-area-top, 0px);

      background: var(--sw-bg);
      color: var(--sw-ink);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Топбар кита скрыт — у макета своя шапка магазина */
    .sw .tg-app-bar { display: none; }

    /* Шапка магазина зафиксирована; отступ сверху разводит её со статус-баром устройства */
    .swTopBar {
      display: flex; align-items: center; gap: 12px;
      padding: calc(12px + var(--sw-safe)) 16px 12px;
      background: var(--sw-card);
      flex: 0 0 auto;
      border-bottom: 1px solid var(--sw-line-3);
    }
    .swBurger {
      width: 44px; height: 44px; flex: 0 0 44px;
      border: none; border-radius: 8px;
      background: var(--sw-brand); color: var(--sw-card);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .swSearch {
      flex: 1; height: 44px;
      border: 1px solid var(--sw-line); border-radius: 8px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; color: var(--sw-ink-2); font-size: 16px;
    }
    .swDelivery {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 16px; background: var(--sw-bg);
      font-size: 14px; color: var(--sw-ink-2);
    }
    .swDelivery b { color: var(--sw-ink); font-weight: 700; }

    .swScroll { flex: 1; overflow-y: auto; padding-bottom: 8px; }
    .swCard { background: var(--sw-card); border-radius: 16px; margin-top: 8px; padding: 20px 16px; }

    /* Заголовки — строго Gerbera Medium (500) */
    .sw .swH1, .sw .swH2, .sw .swH3 {
      font-family: 'Gerbera', var(--font-sans);
      font-weight: 500;
      font-synthesis: none;
      color: var(--sw-ink);
    }
    .swH1 { margin: 0 0 12px; font-size: 24px; line-height: 1.25; letter-spacing: -0.01em; }
    .swH1--center { text-align: center; }
    .swH2 { margin: 0 0 6px; font-size: 20px; line-height: 1.3; }
    .swH3 { margin: 0 0 10px; font-size: 16px; }
    .swSub { margin: 0 0 16px; font-size: 16px; line-height: 1.4; color: var(--sw-ink-2); }
    .swSub--center { text-align: center; }
    .swMuted { color: var(--sw-ink-2); }

    /* Поля: 48px как в макете; при заполнении внутрь встаёт лейбл */
    .swField { margin-bottom: 12px; }
    .swInput {
      display: flex; align-items: center; gap: 10px;
      height: 48px;
      border: 1px solid var(--sw-line); border-radius: 8px;
      background: var(--sw-card); padding: 0 14px; box-sizing: border-box;
    }
    .swInput.is-focus { border-color: var(--sw-ink); border-width: 2px; padding: 0 13px; }
    .swInput.is-error { border-color: var(--sw-error); }
    .swInput input {
      flex: 1; min-width: 0; border: none; outline: none; background: transparent;
      font-size: 16px; color: var(--sw-ink); padding: 0; caret-color: var(--sw-ink);
    }
    .swInput input::placeholder { color: var(--sw-ink-2); opacity: 1; }
    .swInputStack { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
    .swInputStack .swInputLabel { font-size: 12px; color: var(--sw-ink-2); line-height: 14px; }
    .swInputStack input { font-size: 16px; line-height: 20px; }
    .swCaret { color: var(--sw-ink); font-size: 12px; }
    .swHelper { margin: 6px 2px 0; font-size: 14px; line-height: 1.35; color: var(--sw-ink-2); }
    .swHelper--error { color: var(--sw-error); }
    .swIconBtn {
      background: none; border: none; padding: 0;
      width: 28px; height: 28px; flex: 0 0 28px;
      display: flex; align-items: center; justify-content: center;
      color: var(--sw-ink); cursor: pointer;
    }
    .swSpinner {
      width: 22px; height: 22px; flex: 0 0 22px;
      border: 3px solid var(--sw-line-2); border-top-color: var(--sw-brand-d);
      border-radius: 50%; animation: swSpin 0.8s linear infinite;
    }
    @keyframes swSpin { to { transform: rotate(360deg); } }
    .swFlag {
      width: 24px; height: 24px; flex: 0 0 24px; border-radius: 50%;
      overflow: hidden; display: flex; flex-direction: column;
      border: 1px solid var(--sw-line-2); box-sizing: border-box;
    }
    .swFlag i { display: block; flex: 1; }
    .swFlag i:nth-child(1) { background: var(--white); }
    .swFlag i:nth-child(2) { background: var(--blue-800); }
    .swFlag i:nth-child(3) { background: var(--red-700); }

    .swTint { background: var(--sw-tint); border-radius: 12px; padding: 16px; margin: 4px 0 16px; }
    .swTintHead { display: flex; align-items: center; gap: 12px; }
    .swTintHead .swCbLabel { font-size: 16px; }
    .swInfo {
      width: 24px; height: 24px; flex: 0 0 24px;
      border: 1.5px solid var(--sw-ink-2); border-radius: 50%;
      color: var(--sw-ink-2); font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      background: none; cursor: pointer;
    }

    .swCb {
      display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px;
      cursor: pointer; text-align: left; background: none; border: none;
      padding: 0; width: 100%;
    }
    .swCbBox {
      width: 22px; height: 22px; flex: 0 0 22px;
      border: 1.5px solid var(--sw-line); border-radius: 5px;
      background: var(--sw-card); display: flex; align-items: center;
      justify-content: center; margin-top: 1px; color: var(--sw-card);
    }
    .swCbBox.is-on { background: var(--sw-brand); border-color: var(--sw-brand); }
    .swCbLabel { font-size: 14px; line-height: 1.35; color: var(--sw-ink); }
    .swCbSub { display: block; font-size: 14px; color: var(--sw-ink-2); margin-top: 2px; }

    .swBtn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 48px; border: none; border-radius: 8px;
      background: var(--sw-brand); color: var(--sw-card);
      font-size: 16px; font-weight: 700; cursor: pointer; box-sizing: border-box;
    }
    .swBtn:active { background: var(--sw-brand-d); }
    .swBtn:disabled { opacity: 0.4; cursor: default; }
    .swBtn--ghost { background: none; color: var(--sw-brand); border: 1.5px solid var(--sw-brand); }
    .swBtn--inline { width: auto; padding: 0 24px; }
    .swBtnRow { margin-top: 10px; }
    .swLink {
      background: none; border: none; padding: 0;
      font-size: 16px; color: var(--sw-brand-d); cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .swLink--bold { font-weight: 700; }
    .swLink--muted { color: var(--sw-ink-2); }
    .swInlineLink { color: var(--sw-brand-d); text-decoration: none; }
    .swCenter { display: flex; justify-content: center; }

    .swConsult { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
    .swAvatar {
      width: 56px; height: 56px; flex: 0 0 56px; border-radius: 50%;
      background: var(--sw-line-3); display: flex; align-items: center;
      justify-content: center; color: var(--sw-ink-2); font-size: 18px;
      font-weight: 700; overflow: hidden;
    }
    .swAvatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .swConsultName { font-size: 16px; font-weight: 700; color: var(--sw-ink); }
    .swConsultRole { font-size: 14px; color: var(--sw-ink-2); margin-top: 2px; }

    /* Экран кода: тот же отступ под статус-бар */
    .swCode {
      flex: 1; background: var(--sw-card); display: flex; flex-direction: column;
      align-items: center; padding: calc(12px + var(--sw-safe)) 20px 16px; overflow-y: auto;
    }
    .swCodeClose {
      align-self: flex-end; background: none; border: none;
      font-size: 28px; line-height: 1; color: var(--sw-ink-2);
      cursor: pointer; padding: 4px 8px;
    }
    .swPins { display: flex; gap: 10px; margin: 24px 0 20px; }
    .swPin {
      width: 44px; height: 52px; border: 1px solid var(--sw-line); border-radius: 8px;
      text-align: center; font-size: 22px; font-weight: 700;
      color: var(--sw-ink); outline: none; background: var(--sw-card); caret-color: var(--sw-brand);
    }
    .swPin:focus { border-color: var(--sw-brand); }
    .swPin.is-error { border-color: var(--sw-error); }
    .swTimer { font-size: 16px; color: var(--sw-ink-2); margin: 0; }

    /* Календарь выбора даты рождения */
    function CalendarSheet({ value, onPick, onClose }) {
      const parse = (s) => {
        const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s || '');
        return m ? { d: +m[1], m: +m[2] - 1, y: +m[3] } : null;
      };
      const init = parse(value) || { d: 0, m: 0, y: 1990 };
      const [ym, setYm] = useState({ y: init.y, m: init.m });
      const [sel, setSel] = useState(init.d ? init : null);

      const daysIn = (y, m) => [31, (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m];
      const firstDow = (y, m) => ((new Date(y, m, 1).getDay() + 6) % 7);
      const years = [];
      for (let y = 2012; y >= 1930; y--) years.push(y);

      const shift = (delta) => setYm((s) => {
        const t = s.m + delta;
        return { y: s.y + Math.floor(t / 12), m: ((t % 12) + 12) % 12 };
      });

      const cells = [];
      for (let i = 0; i < firstDow(ym.y, ym.m); i++) cells.push(null);
      for (let d = 1; d <= daysIn(ym.y, ym.m); d++) cells.push(d);

      const pad = (n) => String(n).padStart(2, '0');

      return (
        <div className="swScrim" onClick={onClose}>
          <div className="swSheet" onClick={(e) => e.stopPropagation()}>
            <div className="swSheetHead">
              <h2 className="swH2">{CONTENT.calendar.title}</h2>
              <button type="button" className="swSheetClose" onClick={onClose}>{CONTENT.icons.close}</button>
            </div>

            <div className="swCalYear">
              <select value={ym.m} onChange={(e) => setYm((s) => ({ ...s, m: +e.target.value }))}>
                {CONTENT.calendar.months.map((mn, i) => <option key={mn} value={i}>{mn}</option>)}
              </select>
              <select value={ym.y} onChange={(e) => setYm((s) => ({ ...s, y: +e.target.value }))}>
                {years.map((y) => <option key={y} value={y}>{y}</option>)}
              </select>
            </div>

            <div className="swCalHead">
              <button type="button" className="swCalNav" onClick={() => shift(-1)} aria-label={CONTENT.a11y.prev}>‹</button>
              <span className="swCalTitle">{CONTENT.calendar.months[ym.m]} {ym.y}</span>
              <button type="button" className="swCalNav" onClick={() => shift(1)} aria-label={CONTENT.a11y.next}>›</button>
            </div>

            <div className="swCalGrid">
              {CONTENT.calendar.dows.map((w) => <div className="swCalDow" key={w}>{w}</div>)}
              {cells.map((d, i) => d === null
                ? <span key={'e' + i} />
                : (
                  <button
                    key={d}
                    type="button"
                    className={sel && sel.d === d && sel.m === ym.m && sel.y === ym.y ? 'swCalDay is-sel' : 'swCalDay'}
                    onClick={() => setSel({ d, m: ym.m, y: ym.y })}
                  >{d}</button>
                ))}
            </div>

            <div className="swBtnRow">
              <button type="button" className="swBtn" disabled={!sel}
                      onClick={() => { onPick(`${pad(sel.d)}.${pad(sel.m + 1)}.${sel.y}`); onClose(); }}>
                {CONTENT.calendar.apply}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function CodeScreen({ phone, onDone, onClose, onHelp }) {
      const [code, setCode] = useState('');
      const [error, setError] = useState(false);
      const [left, setLeft] = useState(RESEND_SEC);
      const refs = useRef([]);

      useEffect(() => {
        if (left <= 0) return undefined;
        const id = setTimeout(() => setLeft((s) => s - 1), 1000);
        return () => clearTimeout(id);
      }, [left]);

      // WHY: в макете нет кнопки подтверждения — код проверяется на 5-й цифре
      useEffect(() => {
        if (code.length < 5) return;
        if (code === '00000') setError(true);
        else onDone();
      }, [code]);

      const setDigit = (i, raw) => {
        const ch = raw.replace(/\D/g, '').slice(-1);
        const next = Array.from({ length: 5 }, (_, k) => (k === i ? ch : code[k] || '')).join('');
        setError(false);
        setCode(next);
        if (ch && i < 4) refs.current[i + 1]?.focus();
      };
      const onKey = (i, e) => { if (e.key === 'Backspace' && !code[i] && i > 0) refs.current[i - 1]?.focus(); };
      const mmss = `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`;

      return (
        <div className="swCode">
          <button type="button" className="swCodeClose" onClick={onClose}>{CONTENT.icons.close}</button>
          <h1 className="swH1 swH1--center">{CONTENT.sms.title}</h1>
          <p className="swSub swSub--center">{CONTENT.sms.subA}<b>{phone}</b>{CONTENT.sms.subB}</p>
          <div className="swPins">
            {[0, 1, 2, 3, 4].map((i) => (
              <input key={i} ref={(el) => (refs.current[i] = el)}
                     className={error ? 'swPin is-error' : 'swPin'}
                     inputMode="numeric" maxLength={2} value={code[i] || ''}
                     onChange={(e) => setDigit(i, e.target.value)}
                     onKeyDown={(e) => onKey(i, e)}
                     aria-label={CONTENT.sms.title} />
            ))}
          </div>
          {error && <p className="swHelper swHelper--error" style={{ marginBottom: 12 }}>{CONTENT.sms.error}</p>}
          {left > 0
            ? <p className="swTimer">{CONTENT.sms.resend} {mmss}</p>
            : <button type="button" className="swLink swLink--bold" onClick={() => { setLeft(RESEND_SEC); setCode(''); }}>{CONTENT.sms.resendNow}</button>}
          <button type="button" className="swLink swLink--muted" style={{ marginTop: 28 }} onClick={onHelp}>
            <span className="swInfo" style={{ width: 20, height: 20, flex: '0 0 20px' }}>{CONTENT.icons.info}</span>
            {CONTENT.sms.help}
          </button>
        </div>
      );
    }

    function DoneScreen({ profile, setField, onSave, saved, onPickDate }) {
      return (
        <>
          <TopBar />
          <div className="swScroll">
            <Delivery />
            <div className="swCard">
              <h1 className="swH1 swH1--center">{CONTENT.done.title}</h1>
              <p className="swSub swSub--center">{CONTENT.done.sub}</p>
              <div className="swContract">
                <div className="swContractNum">{CONTENT.done.contractLabel} {CONTRACT} <CopyIcon /></div>
                <p className="swContractHint">
                  {CONTENT.done.contractHintA}
                  <span className="swInlineLink">{CONTENT.done.contractHintB}</span>
                  {CONTENT.done.contractHintC}
                  <span className="swInlineLink">{CONTENT.done.contractHintD}</span>
                </p>
                <div className="swCenter">
                  <button type="button" className="swBtn swBtn--inline">{CONTENT.done.toShop}</button>
                </div>
              </div>
            </div>

            <div className="swCard">
              <h2 className="swH2">{CONTENT.done.profileTitle}</h2>
              <p className="swSub">{CONTENT.done.profileSub}</p>
              <h3 className="swH3">{CONTENT.done.personal}</h3>
              <div className="swField">
                <div className="swInput">
                  <input value={profile.lastName} placeholder={CONTENT.done.lastName} onChange={(e) => setField('lastName', e.target.value)} />
                </div>
              </div>
              <div className="swField">
                <div className="swInput">
                  <input value={profile.firstName} placeholder={CONTENT.done.firstName} onChange={(e) => setField('firstName', e.target.value)} />
                </div>
              </div>
              <div className="swField">
                <div className="swInput" onClick={onPickDate} style={{ cursor: 'pointer' }}>
                  <div className="swInputStack">
                    {profile.birth ? <span className="swInputLabel">{CONTENT.done.birth}</span> : null}
                    <input value={profile.birth} placeholder={profile.birth ? '' : CONTENT.done.birth} readOnly />
                  </div>
                  <span className="swIconBtn"><CalendarIcon /></span>
                </div>
                <p className="swHelper">{CONTENT.done.birthHelper}</p>
              </div>
              <div className="swField">
                <div className="swInput">
                  <input value={profile.email} placeholder={CONTENT.done.email} inputMode="email" onChange={(e) => setField('email', e.target.value)} />
                </div>
                <p className="swHelper">{CONTENT.done.emailHelper}</p>
              </div>

              <Checkbox on={profile.promo} onToggle={() => setField('promo', !profile.promo)}>
                {CONTENT.done.promo}
                <span className="swCbSub">{CONTENT.done.promoSub}</span>
              </Checkbox>

              <div className="swDivider" />

              <h3 className="swH3">{CONTENT.done.shopTitle}</h3>
              <p className="swSub">{CONTENT.done.shopSub}</p>
              <div className="swSelect"><span>{CONTENT.done.shopCity}</span><span className="swCaret">{CONTENT.icons.caret}</span></div>
              <div className="swSelect"><span className="swMuted">{CONTENT.done.shopPlaceholder}</span><span className="swCaret">{CONTENT.icons.caret}</span></div>

              <div className="swBtnRow"><button type="button" className="swBtn" onClick={onSave}>{CONTENT.done.save}</button></div>
              {saved && <p className="swHelper" style={{ textAlign: 'center' }}>{CONTENT.done.saved}</p>}
            </div>
          </div>
          <TabBar />
        </>
      );
    }

    /* Оформление заказа — куда попадает пользователь после быстрой реги (макет 8548:22605) */
    const PICKUP = [
      ['Магазин SIBERIAN WELLNESS', 'бесплатно'],
      ['Почтоматы "Почта России"', 'от 130 ₽'],
      ['Пункт выдачи Boxberry', 'от 135 ₽'],
      ['Пункт выдачи CDEK', 'от 135 ₽'],
      ['Пункт выдачи DPD', 'от 138 ₽'],
    ];
    const COURIER = [
      ['CDEK', ''],
      ['DPD доставка до двери', ''],
      ['Экспресс-доставка Siberian Wellness', ''],
      ['Доставка до двери', ''],
      ['Доставка 1 классом', ''],
      ['Доставка в отделение Почты России', ''],
      ['EMS', ''],
    ];

    function CheckoutScreen({ onProfile }) {
      const [picked, setPicked] = useState(null); // 'pickup' | 'courier'
      const price = picked === 'courier' ? 130 : picked === 'pickup' ? 0 : null;
      const total = 2000 + (price || 0);

      const Group = ({ id, title, rows }) => (
        <div className="swCoGroup">
          <div className="swCoGroupHead">
            <span className="swCoGroupTitle">{title}</span>
            <button type="button" className={picked === id ? 'swBtn swBtn--pill is-picked' : 'swBtn swBtn--pill'}
                    onClick={() => setPicked(id)}>
              {picked === id ? CONTENT.checkout.chosen : CONTENT.checkout.choose}
            </button>
          </div>
          {rows.map(([name, sum]) => (
            <div className="swCoRow" key={name}>
              <span className="swCoDot" />
              <span className="swCoName">{name}</span>
              <span className="swCoSum">{sum}</span>
            </div>
          ))}
        </div>
      );

      return (
        <>
          <div className="swScroll">
            <div className="swCoTop">
              <button type="button" className="swBackLink" style={{ padding: 0 }}>
                <span className="swBackChevron">‹</span> {CONTENT.checkout.back}
              </button>
              <span className="swCoPhone">{CONTENT.checkout.phone}</span>
            </div>

            {/* Регистрация подтверждена, но покупку не прерываем */}
            <div className="swCoBanner">
              <div>
                <b>{CONTENT.cart.banner}</b>
                <div className="swCoContract">{CONTENT.cart.contract} {CONTRACT}</div>
              </div>
              <button type="button" className="swLink" onClick={onProfile}>{CONTENT.cart.fillProfile}</button>
            </div>

            <div className="swCard">
              <h1 className="swH1">{CONTENT.checkout.title} #{CONTENT.checkout.order}</h1>
            </div>

            <div className="swCard swCard--active">
              <div className="swCoStep"><span className="swCoNum">1</span><h2 className="swH2" style={{ margin: 0 }}>{CONTENT.checkout.step1}</h2></div>
              <div className="swDelivery" style={{ padding: '10px 0' }}>
                <span>{CONTENT.checkout.delivery}</span><b>{CONTENT.checkout.city}</b>
              </div>
              <Group id="pickup" title={CONTENT.checkout.pickup} rows={PICKUP} />
              <div className="swDivider" />
              <Group id="courier" title={CONTENT.checkout.courier} rows={COURIER} />
            </div>

            <div className="swCard">
              <div className="swCoStep is-off">
                <span className="swCoNum">2</span>
                <h2 className="swH2" style={{ margin: 0, flex: 1 }}>{CONTENT.checkout.step2}</h2>
                <Chevron />
              </div>
            </div>

            <div className="swCard">
              <div className="swCoSum2"><span>{CONTENT.checkout.qty}</span><b>4</b></div>
              <div className="swCoSum2 is-muted"><span>{CONTENT.checkout.points}</span><span>80</span></div>
              <div className="swDivider" />
              <div className="swCoSum2"><span>{CONTENT.checkout.cart}</span><b>2 000 ₽</b></div>
              <div className="swCoSum2"><span>{CONTENT.checkout.deliveryRow}</span>
                <span className={price ? '' : 'swMuted'}>{picked ? (price ? price + ' ₽' : 'бесплатно') : CONTENT.checkout.none}</span></div>
              <div className="swCoSum2"><span>{CONTENT.checkout.payRow}</span><span className="swMuted">{CONTENT.checkout.none}</span></div>
              <div className="swDivider" />
              <div className="swCoTotal"><span>{CONTENT.checkout.total}</span><b>{total} ₽</b></div>
              <div className="swBtnRow">
                <button type="button" className="swBtn" disabled={!picked}>{CONTENT.checkout.cta}</button>
              </div>
            </div>
          </div>
        </>
      );
    }

    function PickerSheet({ onSelect, onClose }) {
      return (
        <div className="swScrim" onClick={onClose}>
          <div className="swSheet swSheet--full" onClick={(e) => e.stopPropagation()}>
            <div className="swSheetHead">
              <h2 className="swH2">{CONTENT.picker.title}</h2>
              <button type="button" className="swSheetClose" onClick={onClose}>{CONTENT.icons.close}</button>
            </div>
            {CONSULTANTS.map((p) => (
              <div className="swPersonCard" key={p.id}>
                <ConsultantRow person={p} />
                <p className="swSub" style={{ margin: '8px 0 4px' }}>{p.bio}</p>
                <button type="button" className="swLink">{CONTENT.picker.more}</button>
                <div className="swTags">{TAGS.map((t) => <span className="swTag" key={t}>{t}</span>)}</div>
                <div className="swSocials">{SOCIALS.map((s) => <span className="swSocial" key={s}>{s}</span>)}</div>
                <button type="button" className="swBtn" onClick={() => onSelect(p)}>{CONTENT.picker.select}</button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* title необязателен — тултип идёт без заголовка */
    function Sheet({ title, body, buttons, onClose }) {
      return (
        <div className="swScrim" onClick={onClose}>
          <div className="swSheet" onClick={(e) => e.stopPropagation()}>
            <div className="swSheetHead">
              {title ? <h2 className="swH2">{title}</h2> : <span />}
              <button type="button" className="swSheetClose" onClick={onClose}>{CONTENT.icons.close}</button>
            </div>
            <p className="swSheetBody">{body}</p>
            {buttons}
          </div>
        </div>
      );
    }

    function Page({ t }) {
      const [screen, setScreen] = useState('reg');
      const [mode, setMode] = useState('direct');
      const [modal, setModal] = useState(null);
      const [saved, setSaved] = useState(false);
      const timer = useRef(null);
      const [reg, setReg] = useState({
        phone: '', wantConsult: false, consultNum: '', consultant: null,
        name: '', agree1: false, agree2: false, consultError: false, checking: false,
      });
      const [profile, setProfile] = useState({ lastName: '', firstName: '', birth: '', email: '', promo: false });

      useEffect(() => () => clearTimeout(timer.current), []);

      const set = (k, v) => setReg((r) => ({ ...r, [k]: v }));
      const setField = (k, v) => setProfile((p) => ({ ...p, [k]: v }));

      const actions = {
        set,
        toggle: (k) => setReg((r) => ({ ...r, [k]: !r[k] })),
        toggleWantConsult: () => setReg((r) => ({ ...r, wantConsult: !r.wantConsult, consultant: null, consultNum: '', consultError: false })),
        setConsultNum: (v) => setReg((r) => ({ ...r, consultNum: v, consultError: false })),
        // «Изменить Консультанта» — блок возвращается в дефолт
        resetConsultant: () => setReg((r) => ({ ...r, consultant: null, consultNum: '', consultError: false, checking: false })),
        // Проверка стартует по стрелке, лоадер держится 2 секунды
        checkConsultNum: () => {
          setReg((r) => ({ ...r, checking: true, consultError: false }));
          clearTimeout(timer.current);
          timer.current = setTimeout(() => {
            setReg((r) => {
              const found = CONSULTANTS.find((p) => p.id === digits(r.consultNum));
              return found
                ? { ...r, checking: false, consultant: found, consultError: false }
                : { ...r, checking: false, consultError: true };
            });
          }, CHECK_MS);
        },
        openPicker: () => setModal('picker'),
        openTooltip: () => setModal('tooltip'),
        goLogin: () => setScreen('login'),
        submit: () => {
          if (mode === 'direct' && !reg.consultant) setModal('noConsult');
          else setScreen('code');
        },
      };

      const phoneLabel = digits(reg.phone) ? fmtPhone(digits(reg.phone)) : '+7 913 123 4567';

      const startFlow = (m) => {
        setMode(m);
        setReg((r) => ({ ...r, consultant: m === 'referral' ? CONSULTANTS[0] : null, wantConsult: m === 'referral' }));
        setScreen('reg');
      };

      return (
        <div className="sw" data-theme={t.theme === 'night' ? 'dark' : undefined}>
          {screen === 'entry' && <EntryScreen onPick={startFlow} />}
          {screen === 'reg' && <RegScreen mode={mode} state={reg} actions={actions} />}
          {screen === 'login' && <LoginScreen onBack={() => setScreen('reg')} />}
          {screen === 'code' && (
            <CodeScreen phone={phoneLabel} onDone={() => setScreen(FLOW === 'cart' ? 'checkout' : 'done')}
                        onClose={() => setModal('leave')} onHelp={() => setModal('smsHelp')} />
          )}
          {screen === 'checkout' && <CheckoutScreen onProfile={() => setScreen('done')} />}
          {screen === 'done' && (
            <DoneScreen profile={profile} setField={setField} saved={saved}
                        onSave={() => setSaved(true)} onPickDate={() => setModal('calendar')} />
          )}

          {modal === 'calendar' && (
            <CalendarSheet value={profile.birth} onPick={(v) => setField('birth', v)} onClose={() => setModal(null)} />
          )}

          {modal === 'picker' && (
            <PickerSheet
              onClose={() => setModal(null)}
              onSelect={(p) => {
                setReg((r) => ({ ...r, consultant: p, wantConsult: true, consultNum: p.id, consultError: false }));
                setModal(null);
                if (screen !== 'reg') setScreen('reg');
              }}
            />
          )}

          {modal === 'noConsult' && (
            <Sheet title={CONTENT.noConsult.title} body={CONTENT.noConsult.body} onClose={() => setModal(null)}
              buttons={
                <>
                  <div className="swBtnRow">
                    <button type="button" className="swBtn" onClick={() => setModal('picker')}>{CONTENT.noConsult.choose}</button>
                  </div>
                  <div className="swBtnRow">
                    <button type="button" className="swBtn swBtn--ghost" onClick={() => { setModal(null); setScreen('code'); }}>
                      {CONTENT.noConsult.skip}
                    </button>
                  </div>
                </>
              } />
          )}

          {modal === 'smsHelp' && (
            <Sheet title={CONTENT.smsHelp.title} body={CONTENT.smsHelp.body} onClose={() => setModal(null)} buttons={null} />
          )}

          {modal === 'tooltip' && (
            <Sheet body={CONTENT.tooltip.body} onClose={() => setModal(null)} buttons={null} />
          )}

          {modal === 'leave' && (
            <Sheet title={CONTENT.leave.title} body={CONTENT.leave.body} onClose={() => setModal(null)}
              buttons={
                <>
                  {/* Главное действие — остаться и завершить регистрацию */}
                  <div className="swBtnRow">
                    <button type="button" className="swBtn" onClick={() => setModal(null)}>{CONTENT.leave.cancel}</button>
                  </div>
                  <div className="swBtnRow">
                    <button type="button" className="swBtn swBtn--ghost" onClick={() => { setModal(null); setScreen('reg'); }}>
                      {CONTENT.leave.confirm}
                    </button>
                  </div>
                </>
              } />
          )}
        </div>
      );
    }

    function App() { return <Page t={{ theme: 'day' }} />; }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
</body>
</html>
